<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>함께, 탐독 문학기행 활동지</title>
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&display=swap" rel="stylesheet">
<style>
:root{--bg:#F6F3EA;--card:#FFFFFF;--ink:#1C1C1C;--sub:#5A5648;--box:#EAE6D8;--line:#1C1C1C;--green:#B7D56A;--coral:#F2917A;--soft:#F7F5EE;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1B1A17;--card:#26241F;--ink:#F1EEE4;--sub:#B9B4A3;--box:#3A372E;--line:#F1EEE4;--soft:#1F1E1A}}
*,*:before,*:after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Gowun Dodum','Apple SD Gothic Neo','Malgun Gothic',sans-serif;font-size:16px;line-height:1.6}
.wrap{max-width:560px;margin:0 auto;padding:16px 14px 90px}
h1{font-family:'Jua','Apple SD Gothic Neo',sans-serif;font-weight:400;font-size:30px;line-height:1.2;margin:6px 0 14px}
.tabs{display:flex;gap:8px;position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);padding:8px 0;z-index:5}
.tabs button{flex:1;font:inherit;font-family:'Jua',sans-serif;font-size:15px;line-height:1.25;padding:10px 4px;border:2.5px solid var(--line);border-radius:14px;background:var(--card);color:var(--ink);cursor:pointer}
.tabs button[aria-selected="true"]{background:var(--green);color:#1C1C1C}
.who{border:2.5px dashed var(--line);background:var(--box);border-radius:14px;padding:10px 12px;margin:10px 0 16px;display:grid;grid-template-columns:auto 1fr;gap:6px 10px;align-items:center}
.who label{font-family:'Jua',sans-serif}
input[type=text],textarea{width:100%;font:inherit;font-size:16px;color:var(--ink);background:var(--soft);border:2px solid var(--line);border-radius:10px;padding:9px 11px}
.who input{background:transparent;border:0;border-bottom:2px solid var(--line);border-radius:0;padding:4px 2px}
textarea{resize:vertical;min-height:96px;display:block}
input:focus,textarea:focus,button:focus-visible{outline:3px solid var(--coral);outline-offset:2px}
.q{background:var(--card);border:3px solid var(--line);border-radius:20px;padding:14px 14px 16px;margin:0 0 14px}
.q h2{font-family:'Jua',sans-serif;font-weight:400;font-size:18px;line-height:1.45;margin:0 0 10px;display:flex;gap:10px;align-items:flex-start}
.n{flex:none;min-width:34px;height:34px;border:2.5px solid var(--line);border-radius:17px 17px 17px 4px;display:grid;place-items:center;font-size:14px;background:var(--card)}
.sub{margin:0 0 6px;font-size:15px}
.sub+textarea{min-height:64px;margin-bottom:12px}
.tip{font-size:14px;color:var(--sub);margin:0 0 10px}
.row{display:grid;gap:4px;margin:0 0 10px}
.row span{font-family:'Jua',sans-serif;font-size:15px}
.chk{display:flex;align-items:center;gap:10px;padding:8px 2px;font-size:16px}
.chk input{width:22px;height:22px;accent-color:#1C1C1C;flex:none}
.kw{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.kw div{display:flex;align-items:center;gap:2px}
.kw b{font-family:'Jua',sans-serif;font-size:20px}
.bar{position:fixed;left:0;right:0;bottom:0;background:var(--bg);border-top:2.5px solid var(--line);padding:10px 14px calc(10px + env(safe-area-inset-bottom,0px));display:flex;gap:8px;justify-content:center;z-index:6}
.bar button{font-family:'Jua',sans-serif;font-size:16px;padding:11px 6px;border:2.5px solid var(--line);border-radius:14px;cursor:pointer;color:#1C1C1C;background:var(--coral);flex:1;max-width:260px}
.bar button.alt{background:var(--card);color:var(--ink)}
.msg{position:fixed;left:50%;transform:translateX(-50%);bottom:84px;background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:12px;font-size:15px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:7}
.msg.on{opacity:1}
.save{font-size:13px;color:var(--sub);text-align:right;margin:-6px 2px 8px}
[hidden]{display:none!important}
.meta p{margin:0 0 6px}
.meta b{font-family:'Jua',sans-serif;font-weight:400;margin-right:8px}
.th{font-family:'Jua',sans-serif;font-weight:400;font-size:18px;margin:4px 2px 8px}
.tbw{border:3px solid var(--line);border-radius:20px;overflow:hidden;margin:0 0 16px;background:var(--card)}
.tb{width:calc(100% + 4px);margin:-2px;table-layout:fixed;border-collapse:collapse;font-size:14px;line-height:1.45}
.tb th,.tb td{border:1.5px solid var(--line);padding:8px 5px;vertical-align:middle;word-break:keep-all}
.tb th{background:#2F4F8F;color:#fff;font-family:'Jua',sans-serif;font-weight:400}
.tb td.p{font-family:'Jua',sans-serif;text-align:center;background:var(--soft)}
.tb td.c{text-align:center}
.tb ul{margin:0;padding:0;list-style:none}
.tb li{position:relative;padding-left:11px}
.tb li+li{margin-top:4px}
.tb li:before{content:"·";position:absolute;left:2px}
.go{display:block;text-align:center;text-decoration:none;font-family:'Jua',sans-serif;font-size:18px;padding:14px;border:3px solid var(--line);border-radius:16px;background:var(--green);color:#1C1C1C}
</style>
</head>
<body>
<div class="wrap">
  <div class="tabs" role="tablist">
    <button role="tab" id="t0" aria-selected="true">문학기행</button>
    <button role="tab" id="t1" aria-selected="false">북 큐레이션 카드</button>
    <button role="tab" id="t2" aria-selected="false">안내</button>
  </div>
  <h1 id="title">‘함께, 탐독’<br>문학기행</h1>
  <div class="who">
    <label for="school">학교</label><input type="text" id="school">
    <label for="sid">학번</label><input type="text" id="sid" inputmode="numeric">
    <label for="name">이름</label><input type="text" id="name" autocomplete="name">
  </div>
  <div class="save" id="save">쓰는 내용은 이 기기에 자동 저장돼요</div>
  <main id="form"></main>
</div>
<div class="bar">
  <button class="alt" id="clear">지우기</button>
  <button class="alt" id="copy">복사하기</button>
  <button id="submit">제출하기</button>
</div>
<div class="msg" id="msg" role="status"></div>

<script>
var SHEETS=[
 {title:"‘함께, 탐독’<br>문학기행",items:[
  {k:"a1",q:"내가 생각하는 ‘도서관’은 어떤 공간인가요?",t:"area"},
  {k:"a2",q:"황윤석도서관에 대해 방문 전에 알아보기로 해요.",t:"multi",subs:[
    "1) 도서관의 운영정보를 온라인으로 찾으려면 어디로 접근해야 할까요?",
    "2) 황윤석도서관은 평일 몇시까지 개방하나요?",
    "3) 황윤석도서관이 소장하고 있는 장서수는?",
    "4) 황윤석이 누구인가요?"]},
  {k:"a3",q:"나의 진로 또는 관심 주제 분야의 자료를 검색하고 서가에서 찾아봅시다!",t:"fields",
   tip:"Tip! 현장이 복잡할 수 있으니 도서관 방문전 온라인으로 자료검색을 먼저 해 두세요.",
   fields:["검색어","청구기호(책위치)","서명/저자","출판사","출판년도"]},
  {k:"a4",q:"학교도서관과는 다른, 공공도서관만의 서비스에는 어떤 것이 있었나요?",t:"area"},
  {k:"a5",q:"독립서점이란 무엇인가요?",t:"area"},
  {k:"a6",q:"내가 서점 주인이 된다면 어떤 컨셉으로 운영하고 싶나요?",t:"area"},
  {k:"a7",q:"오늘 활동을 통해 새로 알게 된 점이나 관점/생각의 변화 등에 대해 알려주세요.",t:"area"}
 ]},
 {title:"북 큐레이션<br>카드",items:[
  {k:"b1",q:"나의 눈길을 끈 책, 마음에 드는 책을 골라봅시다.",t:"book"},
  {k:"b2",q:"이 책에서 가장 마음에 드는 부분은 어디인가요?",t:"area",tip:"Tip! 제목, 표지, 목차, 소개글 등 마음에 드는 부분과 그 이유를 작성해 봅시다."},
  {k:"b3",q:"내가 고른 책을 누구에게 추천하고 싶은가요?",t:"area",tip:"예) 새로운 것을 발견하고 싶은 사람, 고민이 있는 사람, 선택하는 게 어려운 사람 등"},
  {k:"b4",q:"내가 이 책을 추천하는 이유는 무엇인가요?",t:"area"},
  {k:"b5",q:"내가 고른 책을 세 가지의 키워드로 설명해 봅시다.",t:"kw"}
 ]}
];
var cur=0, data={};
try{data=JSON.parse(localStorage.getItem("lit-trip-v1")||"{}")}catch(e){data={}}
var timer;
function persist(){
  try{localStorage.setItem("lit-trip-v1",JSON.stringify(data));document.getElementById("save").textContent="자동 저장됨"}
  catch(e){document.getElementById("save").textContent="저장이 안 되는 환경이에요. 쓴 내용을 복사해 두세요"}
}
function bind(el,key){
  el.value=data[key]||"";
  el.addEventListener("input",function(){data[key]=el.value;clearTimeout(timer);timer=setTimeout(persist,300)});
}
function mk(tag,cls,txt){var e=document.createElement(tag);if(cls)e.className=cls;if(txt!=null)e.textContent=txt;return e}
function area(key,rows){var t=mk("textarea");if(rows)t.style.minHeight=rows;bind(t,key);return t}
function text(key){var i=mk("input");i.type="text";bind(i,key);return i}
var TABLE=`<h2 class="th">🕒 일정</h2><div class="tbw"><table class="tb"><colgroup><col style="width:19%"><col style="width:22%"><col></colgroup>
<thead><tr><th>프로그램</th><th>시간</th><th>내용</th></tr></thead><tbody>
<tr><td class="p" rowspan="2">학교 집결</td><td class="c">해남, 강진</td><td><ul><li>해남고, 제일중: 해남고등학교 집결 (08:00)</li><li>강진고: 강진고등학교 집결 (08:30)</li></ul></td></tr>
<tr><td class="c">무안</td><td><ul><li>남악고, 남악중: 남악고등학교 집결 (08:45)</li><li>행복중, 오룡중: 오룡중학교 집결 (08:45)</li></ul></td></tr>
<tr><td class="p">이동</td><td class="c">학교별 상이</td><td><ul><li>고창 황윤석 도서관으로 이동 (버스)</li></ul></td></tr>
<tr><td class="p">도서관 견학</td><td class="c">10:00<br>~11:30</td><td><ul><li>고창 황윤석 도서관 견학</li></ul></td></tr>
<tr><td class="p">점심</td><td class="c">11:30<br>~13:00</td><td><ul><li>점심 식사</li></ul></td></tr>
<tr><td class="p">이동</td><td class="c">13:00<br>~13:30</td><td><ul><li>고창 서점마을로 이동 (버스)</li></ul></td></tr>
<tr><td class="p">서점마을 탐방</td><td class="c">13:30<br>~15:00</td><td><ul><li>고창 서점마을 탐방</li></ul></td></tr>
<tr><td class="p">귀가</td><td class="c">15:30<br>~</td><td><ul><li>귀가</li></ul></td></tr>
</tbody></table></div>`;
function renderInfo(){
  document.getElementById("title").innerHTML="‘함께, 탐독’<br>문학기행 안내";
  var h='<section class="q meta"><h2><span class="n">📅</span><span>일시·장소</span></h2><p><b>일시</b>2026. 10. 24.(토) 08:30~16:30</p><p><b>장소</b>고창 황윤석 도서관, 고창 서점마을</p></section>';
  h+=TABLE;
  h+='<a class="go" href="https://form.naver.com/response/2PkckCZ3Esi" target="_blank" rel="noopener">설문조사 참여하기</a>';
  document.getElementById("form").innerHTML=h;
}
function render(){
  var info=cur===2;
  document.querySelector(".who").hidden=info;
  document.getElementById("save").hidden=info;
  document.querySelector(".bar").hidden=info;
  if(info){renderInfo();return}
  var s=SHEETS[cur],f=document.getElementById("form");
  document.getElementById("title").innerHTML=s.title;
  f.innerHTML="";
  s.items.forEach(function(it,idx){
    var c=mk("section","q"),h=mk("h2");
    h.appendChild(mk("span","n",String(idx+1).padStart(2,"0")));
    h.appendChild(mk("span",null,it.q));c.appendChild(h);
    if(it.tip&&it.t!=="fields")c.appendChild(mk("p","tip",it.tip));
    if(it.t==="area")c.appendChild(area(it.k));
    if(it.t==="multi")it.subs.forEach(function(sq,i){c.appendChild(mk("p","sub",sq));c.appendChild(area(it.k+"_"+i))});
    if(it.t==="fields"){
      it.fields.forEach(function(fl,i){var r=mk("label","row");r.appendChild(mk("span",null,fl));r.appendChild(text(it.k+"_"+i));c.appendChild(r)});
      c.appendChild(mk("p","tip",it.tip));
    }
    if(it.t==="book"){
      [["책 제목","b1_title"],["저자","b1_author"],["출판사","b1_pub"]].forEach(function(p){
        var r=mk("label","row");r.appendChild(mk("span",null,p[0]));r.appendChild(text(p[1]));c.appendChild(r)});
      c.appendChild(mk("p","sub","내가 이 책을 선택한 이유는?"));
      ["표지가 눈에 띄어서","제목이 마음에 들어서"].forEach(function(lb,i){
        var l=mk("label","chk"),cb=mk("input");cb.type="checkbox";cb.checked=!!data["b1_c"+i];
        cb.addEventListener("change",function(){data["b1_c"+i]=cb.checked;persist()});
        l.appendChild(cb);l.appendChild(mk("span",null,lb));c.appendChild(l)});
      var r=mk("label","row");r.appendChild(mk("span",null,"기타"));r.appendChild(text("b1_etc"));c.appendChild(r);
    }
    if(it.t==="kw"){
      var g=mk("div","kw");
      for(var i=0;i<3;i++){var d=mk("div");d.appendChild(mk("b",null,"#"));d.appendChild(text("b5_"+i));g.appendChild(d)}
      c.appendChild(g);
    }
    f.appendChild(c);
  });
}
function toast(m){var e=document.getElementById("msg");e.textContent=m;e.classList.add("on");setTimeout(function(){e.classList.remove("on")},1800)}
function compose(){
  var s=SHEETS[cur],o=[s.title.replace("<br>"," ")];
  o.push("학교: "+(data.school||"")+"  학번: "+(data.sid||"")+"  이름: "+(data.name||""),"");
  s.items.forEach(function(it,idx){
    o.push((idx+1)+". "+it.q);
    if(it.t==="area")o.push(data[it.k]||"");
    if(it.t==="multi")it.subs.forEach(function(sq,i){o.push(sq);o.push("→ "+(data[it.k+"_"+i]||""))});
    if(it.t==="fields")it.fields.forEach(function(fl,i){o.push(fl+": "+(data[it.k+"_"+i]||""))});
    if(it.t==="book"){
      o.push("책 제목: "+(data.b1_title||""),"저자: "+(data.b1_author||""),"출판사: "+(data.b1_pub||""));
      var why=[];if(data.b1_c0)why.push("표지가 눈에 띄어서");if(data.b1_c1)why.push("제목이 마음에 들어서");if(data.b1_etc)why.push("기타: "+data.b1_etc);
      o.push("선택한 이유: "+why.join(", "));
    }
    if(it.t==="kw")o.push([0,1,2].map(function(i){return "#"+(data["b5_"+i]||"")}).join("  "));
    o.push("");
  });
  return o.join("\n");
}
document.getElementById("copy").addEventListener("click",function(){
  var t=compose();
  function fb(){var a=document.createElement("textarea");a.value=t;document.body.appendChild(a);a.select();try{document.execCommand("copy");toast("복사했어요")}catch(e){toast("복사에 실패했어요")}a.remove()}
  if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(t).then(function(){toast("복사했어요")},fb)}else fb();
});
var SHEET_URL="https://script.google.com/macros/s/AKfycbzeDy6PcJIGw9njFYhyHf6EH9CwaIFnlC7FcyJfzhOo5Hi-v9gA66RNUxi5X62ION1J/exec";
function sx(v){v=String(v||"").trim();return /^[=+\-@]/.test(v)?"'"+v:v}
function collect(){
  var s=SHEETS[cur],L=[],V=[];
  function add(l,v){L.push(l);V.push(sx(v))}
  s.items.forEach(function(it,idx){
    var n=String(idx+1).padStart(2,"0")+" ";
    if(it.t==="area")add(n+it.q,data[it.k]);
    if(it.t==="multi")it.subs.forEach(function(sq,i){add(n+sq,data[it.k+"_"+i])});
    if(it.t==="fields")it.fields.forEach(function(fl,i){add(n+fl,data[it.k+"_"+i])});
    if(it.t==="book"){
      add(n+"책 제목",data.b1_title);add(n+"저자",data.b1_author);add(n+"출판사",data.b1_pub);
      var why=[];if(data.b1_c0)why.push("표지가 눈에 띄어서");if(data.b1_c1)why.push("제목이 마음에 들어서");if(data.b1_etc)why.push("기타: "+data.b1_etc);
      add(n+"선택한 이유",why.join(", "));
    }
    if(it.t==="kw")[0,1,2].forEach(function(i){add(n+"키워드 "+(i+1),data["b5_"+i])});
  });
  return {labels:L,values:V};
}
document.getElementById("submit").addEventListener("click",function(){
  var b=this;
  if(!(data.school||"").trim()||!(data.sid||"").trim()||!(data.name||"").trim()){toast("학교, 학번, 이름을 먼저 써 주세요");window.scrollTo(0,0);return}
  if(!confirm("지금 쓴 내용을 선생님께 제출할까요?"))return;
  var c=collect();
  var body=JSON.stringify({sheet:cur===0?"문학기행":"북큐레이션카드",school:sx(data.school),sid:sx(data.sid),name:sx(data.name),labels:c.labels,values:c.values});
  b.disabled=true;b.textContent="제출 중...";
  fetch(SHEET_URL,{method:"POST",body:body}).then(function(r){return r.text()}).then(function(t){
    if(t.trim()!=="ok")throw new Error("bad");
    toast("제출했어요!");
  }).catch(function(){toast("제출이 확인되지 않았어요. 연결을 확인하고 다시 눌러 주세요")}).then(function(){b.disabled=false;b.textContent="제출하기"});
});
document.getElementById("clear").addEventListener("click",function(){
  if(!confirm("이 활동지에 쓴 내용을 모두 지울까요? 되돌릴 수 없어요."))return;
  SHEETS[cur].items.forEach(function(it){Object.keys(data).forEach(function(k){if(k.indexOf(it.k)===0)delete data[k]})});
  persist();render();toast("지웠어요");
});
["school","sid","name"].forEach(function(id){bind(document.getElementById(id),id)});
[0,1,2].forEach(function(i){document.getElementById("t"+i).addEventListener("click",function(){
  cur=i;[0,1,2].forEach(function(j){document.getElementById("t"+j).setAttribute("aria-selected",i===j)});render();window.scrollTo(0,0)})});
render();
</script>
</body>
</html>
